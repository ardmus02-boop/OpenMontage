<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">OpenMontage AI Studio</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#171c26;--line:#252c38;--text:#f5f7fb;--muted:#8e98a8;--accent:#8b7cff;--accent2:#b8adff;--ok:#62d39b;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1a2030 0,#090b10 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{width:min(1120px,94vw);margin:0 auto;padding:28px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-size:25px;font-weight:800;letter-spacing:-.04em}.brand span{color:var(--accent2)}.library{color:var(--muted);text-decoration:none;font-size:13px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{background:rgba(17,21,29,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22)}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px}.prompt{width:100%;min-height:170px;resize:vertical;background:#0d1118;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:15px;font:inherit;font-size:15px;outline:none}.prompt:focus{border-color:#5148a0}.modes,.seg{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0e1219;color:#cbd2de;padding:11px 13px;border-radius:12px;cursor:pointer;font-weight:650}.btn.active{background:#2a244f;border-color:#6257cb;color:#fff}.row{margin-top:18px}.upload{position:relative;min-height:210px;border:1px dashed #3a4352;border-radius:16px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#0d1118;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.upload:hover{border-color:#6257cb;background:#111722}.upload strong{display:block;color:#d8deea;margin-bottom:6px;font-size:15px}.upload input{display:none}.preview{display:none;width:100%;height:150px;object-fit:contain;border-radius:12px;margin-bottom:10px;background:#080b10}.preview.show{display:block}.remove{display:none;position:absolute;top:10px;right:10px;border:1px solid #3b4350;background:#161b24;color:#fff;border-radius:999px;width:30px;height:30px;cursor:pointer}.remove.show{display:block}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.generate{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#7569ff,#9d91ff);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.generate:disabled{opacity:.55;cursor:wait}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:13px}.result{min-height:480px;display:flex;align-items:center;justify-content:center;background:#0b0f15;border:1px solid var(--line);border-radius:14px;overflow:hidden}.result img,.result video{display:block;width:100%;height:auto;max-height:650px;object-fit:contain}.empty{text-align:center;color:var(--muted);padding:30px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{background:#151a23;border:1px solid var(--line);color:#aeb7c6;border-radius:999px;padding:7px 10px;font-size:12px}.download{display:inline-block;margin-top:14px;color:#fff;text-decoration:none;background:#151a23;border:1px solid var(--line);padding:10px 13px;border-radius:10px;font-weight:700}
@media(max-width:850px){.grid{grid-template-columns:1fr}.result{min-height:320px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brandName"></div>
    <a class="library" href="/library">Library →</a>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="label">Generation Mode</div>
      <div class="modes" id="modes">
        <button class="btn active" data-mode="text_to_image">Text to Image</button>
        <button class="btn" data-mode="image_to_image">Image to Image</button>
        <button class="btn" data-mode="text_to_video">Text to Video</button>
        <button class="btn" data-mode="image_to_video">Image to Video</button>
      </div>

      <div class="row">
        <div class="label">Prompt</div>
        <textarea id="prompt" class="prompt" placeholder="Ne oluşturmak istiyorsun?"></textarea>
      </div>

      <div class="row" id="uploadRow" style="display:none">
        <div class="label">Reference Image</div>
        <label class="upload" id="uploadBox">
          <img id="preview" class="preview" alt="Reference preview">
          <button type="button" class="remove" id="removeFile">×</button>
          <strong id="uploadTitle">Görsel seç</strong>
          <span id="fileName">PNG, JPG veya WEBP</span>
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
        </label>
      </div>

      <div class="row controls">
        <div id="durationBox" style="display:none">
          <div class="label">Duration</div>
          <div class="seg">
            <button class="btn active dur" data-duration="5">5 sec</button>
            <button class="btn dur" data-duration="10">10 sec</button>
            <button class="btn dur" data-duration="60">60 sec</button>
          </div>
        </div>
        <div>
          <div class="label">Aspect Ratio</div>
          <div class="seg">
            <button class="btn active ratio" data-ratio="16:9">16:9</button>
            <button class="btn ratio" data-ratio="9:16">9:16</button>
            <button class="btn ratio" data-ratio="1:1">1:1</button>
          </div>
        </div>
      </div>

      <button class="generate" id="generate">GENERATE</button>
      <div class="status" id="status"></div>
    </section>

    <section class="panel">
      <div class="label">Result</div>
      <div class="result" id="result">
        <div class="empty">Üretilen görsel veya video burada görünecek.</div>
      </div>
      <div class="meta" id="meta"></div>
    </section>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const SITE_NAME="OpenMontage AI Studio";
$("#pageTitle").textContent=SITE_NAME;
$("#brandName").textContent=SITE_NAME;
let mode="text_to_image",duration="5",ratio="16:9",referenceDataUrl=null;

const videoMode=()=>mode==="text_to_video"||mode==="image_to_video";
const imageMode=()=>mode==="image_to_image"||mode==="image_to_video";

function refresh(){
  $("#uploadRow").style.display=imageMode()?"block":"none";
  $("#durationBox").style.display=videoMode()?"block":"none";
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));
  refresh();
});
document.querySelectorAll(".dur").forEach(b=>b.onclick=()=>{
  duration=b.dataset.duration;
  document.querySelectorAll(".dur").forEach(x=>x.classList.toggle("active",x===b));
});
document.querySelectorAll(".ratio").forEach(b=>b.onclick=()=>{
  ratio=b.dataset.ratio;
  document.querySelectorAll(".ratio").forEach(x=>x.classList.toggle("active",x===b));
});
$("#file").onchange=()=>{
  const f=$("#file").files[0];
  if(!f)return;
  $("#fileName").textContent=f.name;
  $("#uploadTitle").textContent="Reference Image";
  const r=new FileReader();
  r.onload=()=>{
    referenceDataUrl=r.result;
    $("#preview").src=r.result;
    $("#preview").classList.add("show");
    $("#removeFile").classList.add("show");
  };
  r.readAsDataURL(f);
};

$("#removeFile").onclick=(e)=>{
  e.preventDefault();
  e.stopPropagation();
  referenceDataUrl=null;
  $("#file").value="";
  $("#preview").src="";
  $("#preview").classList.remove("show");
  $("#removeFile").classList.remove("show");
  $("#uploadTitle").textContent="Görsel seç";
  $("#fileName").textContent="PNG, JPG veya WEBP";
};

$("#generate").onclick=async()=>{
  const prompt=$("#prompt").value.trim();
  if(!prompt&&mode!=="image_to_image"){ $("#status").textContent="Prompt gerekli."; return; }
  if(imageMode()&&!referenceDataUrl){ $("#status").textContent="Referans görsel seç."; return; }

  $("#generate").disabled=true;
  $("#status").textContent="Üretiliyor...";
  $("#meta").innerHTML="";
  try{
    const res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      mode,prompt,duration,aspect_ratio:ratio,reference_data_url:referenceDataUrl
    })});
    const data=await res.json();
    if(!data.success) throw new Error(data.error||"Generation failed");

    $("#status").textContent="Hazır.";
    $("#result").innerHTML="";
    if(data.media_url){
      const el=data.kind==="video"?document.createElement("video"):document.createElement("img");
      if(data.kind==="video"){el.controls=true;el.autoplay=true;el.loop=true}
      el.src=data.media_url;
      $("#result").append(el);
      const a=document.createElement("a");a.className="download";a.href=data.media_url;a.download="openmontage-result";a.textContent="Download";
      $("#result").append(a);
    }else{
      $("#result").innerHTML="<div class='empty'>Üretildi fakat yerel medya yolu bulunamadı.</div>";
    }
    const chips=[data.model&&`model: ${data.model}`,data.cost_usd!=null&&`$${Number(data.cost_usd).toFixed(4)}`,data.duration_seconds!=null&&`${Number(data.duration_seconds).toFixed(1)}s`].filter(Boolean);
    $("#meta").innerHTML=chips.map(x=>`<span class="chip">${x}</span>`).join("");
  }catch(e){
    $("#status").textContent=e.message;
  }finally{
    $("#generate").disabled=false;
  }
};
refresh();
</script>
</body>
</html>
